<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#12355b"><title>Call Desk</title><link rel="manifest" href="manifest.webmanifest"><style>
:root{--blue:#12355b;--gold:#d8a33a;--bg:#f4f7fb;--red:#a61b1b;--green:#147a4b;--muted:#64748b}*{box-sizing:border-box}body{margin:0;font:16px system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:#172033}button,input,select,textarea{font:inherit}button,.btn{min-height:46px;border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#e5edf6;color:var(--blue)}.call{background:var(--green);color:#fff}.danger{background:#fee2e2;color:var(--red)}button:disabled,.disabled{opacity:.45;pointer-events:none}.shell{max-width:1100px;margin:auto;padding:16px 16px 94px}.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #dce3ed}.topin{max-width:1100px;margin:auto;padding:12px 16px;display:flex;justify-content:space-between;gap:15px;align-items:center}.brand{font-size:23px;font-weight:850}.small{color:var(--muted);font-size:13px}.save-error{background:#fff1f2;color:#991b1b;padding:9px;border-radius:10px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dce3ed;z-index:10;display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom)}.nav button{background:#fff;border-radius:0;padding:8px 4px;font-size:12px}.nav button.active{color:#0a58a8;background:#eef6ff}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 2px 12px #23395d12}.grid{display:grid;gap:14px}.metrics{grid-template-columns:repeat(4,1fr)}.metric b{font-size:24px;display:block;margin-top:4px}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}h1,h2,h3{margin:.2em 0 .6em}label{display:block;font-size:14px;font-weight:650}input,select,textarea{width:100%;border:1px solid #bfccdc;border-radius:10px;padding:11px;margin-top:5px;background:#fff}textarea{min-height:96px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.list{display:grid;gap:9px}.item{background:#fff;border:1px solid #dce3ed;border-radius:14px;padding:13px;text-align:left}.item:hover{border-color:#6c93ba}.pill{display:inline-block;padding:3px 8px;border-radius:99px;background:#e8eef6;font-size:12px}.warn{background:#fff7ed;color:#9a3412;padding:12px;border-radius:12px}.ok{color:var(--green)}.modal{position:fixed;inset:0;background:#071425aa;z-index:30;display:grid;place-items:center;padding:20px}.modal>.card{max-width:720px;width:100%;max-height:90vh;overflow:auto}.hidden{display:none!important}.progress{height:14px;background:#dce3ed;border-radius:99px;overflow:hidden}.progress span{display:block;height:100%;background:var(--gold)}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;border-bottom:1px solid #dce3ed;text-align:left}.scroll{overflow:auto}.demo{border-left:5px solid var(--gold)}a.btn{display:inline-flex;text-decoration:none;align-items:center;justify-content:center}.section{margin-top:17px}@media(max-width:720px){.metrics,.three,.two{grid-template-columns:1fr 1fr}.metric b{font-size:20px}.nav{grid-template-columns:repeat(3,1fr)}.nav button{min-height:42px}.shell{padding:12px 12px 150px}.topin{align-items:flex-start}.hide-phone{display:none}}@media(max-width:430px){.metrics,.three,.two{grid-template-columns:1fr}.row>*{flex:1}.brand{font-size:20px}}
</style></head><body><div id="app"></div><input id="file" type="file" hidden accept=".json,.csv,application/json,text/csv"><script>
'use strict';
const KEY='callDesk.v1'; const ERRORS=['#N/A','#REF!','#VALUE!','#DIV/0!','#NAME?','#NULL!','#NUM!'];
const empty=()=>({schema:1,created:new Date().toISOString(),settings:{organization:'',owner:'',campaign:'Annual Campaign',goal:100000,currency:'CAD',country:'Canada',timezone:'America/Vancouver',countryCode:'+1',donationLink:'',retryDays:3,maxAttempts:5,backupDays:7,templates:{first:'Hello {name}, this is {myName} from {organization}. I am reaching out about {campaign}.',missed:'Hello {name}, I just tried to reach you about {campaign}. Please call me when convenient.',link:'Thank you, {name}. Here is the donation link for {campaign}: {link}',reminder:'Hello {name}, a friendly reminder about your pledge of {amount} to {campaign}. {link}',thanks:'Thank you, {name}, for your confirmed payment of {amount} to {campaign}.'}},donors:[],households:[],activities:[],pledges:[],payments:[],followups:[],lastBackup:null});
let db=load(), view='dashboard', selected=null, callIndex=0, storageOK=true;
function uid(){return crypto.randomUUID?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(16).slice(2)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function clean(s){s=String(s??'').trim();return ERRORS.includes(s.toUpperCase())?'':s}
function num(v){v=String(v??'').replace(/[$, ]/g,'');let n=Number(v);return Number.isFinite(n)?n:0}
function money(v){try{return new Intl.NumberFormat(undefined,{style:'currency',currency:db.settings.currency||'CAD'}).format(num(v))}catch{return '$'+num(v).toFixed(2)}}
function phone(v){let s=clean(v);return /^[+]?\d[\d ()-]{6,}$/.test(s)?s.replace(/(?!^)\D/g,''):''}
function load(){try{let x=localStorage.getItem(KEY);if(!x)return empty();let d=JSON.parse(x);return d&&d.schema===1?Object.assign(empty(),d):empty()}catch(e){return empty()}}
function save(){let el=document.querySelector('#saveState');try{localStorage.setItem(KEY,JSON.stringify(db));storageOK=true;if(el){el.textContent='Saved on this device';el.className='small ok'}}catch(e){storageOK=false;if(el){el.textContent='SAVE FAILED — download a private backup now';el.className='save-error'}}}
function mutate(fn){fn();save();render()}
function eligible(d){if(d.demo||d.doNotContact)return false;let acts=db.activities.filter(a=>a.donorId===d.id);if(acts.length>=num(db.settings.maxAttempts))return false;let f=db.followups.filter(f=>f.donorId===d.id&&!f.done).sort((a,b)=>a.due.localeCompare(b.due))[0];if(f&&new Date(f.due)>new Date())return false;return true}
function totals(){let pledged=db.pledges.filter(x=>!x.void).reduce((s,x)=>s+num(x.amount),0),paid=db.payments.filter(x=>!x.void).reduce((s,x)=>s+num(x.amount),0);return {pledged,paid,outstanding:Math.max(0,pledged-paid)}}
function shell(content){return `<header class="top"><div class="topin"><div><div class="brand">Call Desk</div><div class="small">${esc(db.settings.organization||'Private fundraising workspace')} · ${esc(db.settings.campaign||'')}</div></div><div id="saveState" class="small ${storageOK?'ok':'save-error'}">${storageOK?'Saved on this device':'SAVE FAILED — download a backup now'}</div></div></header><main class="shell">${content}</main><nav class="nav">${[['dashboard','Dashboard'],['donors','Donors'],['call','Call'],['followups','Follow-ups'],['import','Import'],['settings','Settings']].map(x=>`<button class="${view===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</nav>`}
function render(){if(!db.settings.organization){document.querySelector('#app').innerHTML=setup();return}let c=view==='dashboard'?dashboard():view==='donors'?donors():view==='call'?callScreen():view==='followups'?followups():view==='import'?importScreen():settings();document.querySelector('#app').innerHTML=shell(c)}
function setup(){return `<main class="shell" style="max-width:700px;padding-top:6vh"><div class="card"><h1>Welcome to Call Desk</h1><p>Set up an empty private workspace. Data is stored only in this browser.</p><div class="grid two"><label>Organization<input id="org"></label><label>Your name<input id="owner"></label><label>Campaign<input id="campaign" value="Annual Campaign"></label><label>Fundraising goal<input id="goal" type="number" value="100000"></label><label>Currency<select id="currency"><option>CAD</option><option>USD</option><option>GBP</option><option>EUR</option><option>ILS</option></select></label><label>Time zone<input id="tz" value="America/Vancouver"></label><label>Default phone country code<input id="cc" value="+1"></label><label>Donation website<input id="link" type="url"></label></div><button class="primary section" onclick="finishSetup()">Start Call Desk</button><p class="small">No donor information is included in the app. Import it locally after setup.</p></div></main>`}
function finishSetup(){let org=document.querySelector('#org').value.trim(),owner=document.querySelector('#owner').value.trim();if(!org||!owner)return alert('Enter your organization and your name.');Object.assign(db.settings,{organization:org,owner,campaign:val('campaign'),goal:num(val('goal')),currency:val('currency'),timezone:val('tz'),countryCode:val('cc'),donationLink:val('link')});save();render()}
function dashboard(){let t=totals(),q=db.donors.filter(eligible),due=db.followups.filter(f=>!f.done&&new Date(f.due)<=new Date()).length,missing=db.donors.filter(d=>!d.phone&&!d.altPhone&&!d.demo).length,review=db.donors.filter(d=>d.review).length,pct=Math.min(100,db.settings.goal?100*t.paid/db.settings.goal:0);return `<h1>Campaign dashboard</h1><div class="grid metrics">${[['Goal',money(db.settings.goal)],['Pledged',money(t.pledged)],['Paid',money(t.paid)],['Outstanding',money(t.outstanding)]].map(x=>`<div class="card metric"><span class="small">${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div><div class="card section"><div class="row between"><b>Confirmed payments toward goal</b><span>${pct.toFixed(1)}%</span></div><div class="progress section"><span style="width:${pct}%"></span></div></div><div class="grid three section">${[['Households/donors remaining',q.length],['Calls logged',db.activities.length],['Callbacks due',due],['Missing phone',missing],['Records needing review',review],['Donor records',db.donors.filter(d=>!d.demo).length]].map(x=>`<div class="card metric"><span class="small">${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div>`}
function donors(){let list=db.donors;return `<div class="row between"><h1>Donors</h1><div class="row"><button class="secondary" onclick="demo()">Load fictional demo</button><button class="primary" onclick="editDonor()">+ Add donor</button></div></div><label>Search<input oninput="filterDonors(this.value)" placeholder="Name, household, phone, email"></label><div id="donorList" class="list section">${list.length?list.map(d=>donorItem(d)).join(''):'<div class="card"><h3>Your donor list is empty</h3><p>Add a donor, import CSV, or load clearly fictional demo records. Demo calling and messaging are disabled.</p></div>'}</div>`}
function donorItem(d){return `<button class="item ${d.demo?'demo':''}" data-search="${esc([d.first,d.last,d.household,d.phone,d.email].join(' ').toLowerCase())}" onclick="editDonor('${d.id}')"><b>${esc((d.first+' '+d.last).trim()||d.household||'Unnamed donor')}</b> ${d.demo?'<span class="pill">FICTIONAL DEMO</span>':''}<div class="small">${esc(d.household||'Individual')} · ${esc(d.phone||'No phone')} · Ask ${money(d.ask)}</div></button>`}
function filterDonors(q){q=q.toLowerCase();document.querySelectorAll('#donorList .item').forEach(x=>x.classList.toggle('hidden',!x.dataset.search.includes(q)))}
function editDonor(id){let d=db.donors.find(x=>x.id===id)||{id:uid(),first:'',last:'',household:'',phone:'',altPhone:'',phoneType:'mobile',email:'',address:'',historical:0,ask:0,notes:'',sourceId:'',sourceRow:'',createdAt:new Date().toISOString()};selected=d.id;modal(`<h2>${id?'Edit donor':'Add donor'}</h2><div class="grid two">${field('First name','first',d.first)}${field('Last name','last',d.last)}${field('Household','household',d.household)}${field('Primary phone','phone',d.phone)}${field('Alternate phone','altPhone',d.altPhone)}${field('Phone type','phoneType',d.phoneType)}${field('Email','email',d.email,'email')}${field('Address','address',d.address)}${field('Historical giving','historical',d.historical,'number')}${field('Suggested ask','ask',d.ask,'number')}${field('Source/CRM ID','sourceId',d.sourceId)}${field('Source row','sourceRow',d.sourceRow)}</div><label>Notes<textarea id="f_notes">${esc(d.notes)}</textarea></label><div class="row section"><button class="primary" onclick="saveDonor('${id||''}')">Save donor</button><button class="secondary" onclick="closeModal()">Cancel</button>${id&&!d.demo?`<button class="danger" onclick="removeDonor('${id}')">Delete</button>`:''}</div>`)}
function field(l,id,v,type='text'){return `<label>${l}<input id="f_${id}" type="${type}" value="${esc(v)}"></label>`}
function saveDonor(id){let old=db.donors.find(x=>x.id===id),d=old||{id:selected,createdAt:new Date().toISOString()};['first','last','household','phone','altPhone','phoneType','email','address','notes','sourceId','sourceRow'].forEach(k=>d[k]=clean(val('f_'+k)));d.historical=num(val('f_historical'));d.ask=num(val('f_ask'));d.updatedAt=new Date().toISOString();if(!old)db.donors.push(d);save();closeModal();render()}
function removeDonor(id){if(confirm('Delete this donor? Existing activity will remain in the backup.'))mutate(()=>db.donors=db.donors.filter(x=>x.id!==id));closeModal()}
function demo(){if(db.donors.some(d=>d.demo))return alert('Demo records already loaded.');mutate(()=>db.donors.push({id:'demo-ari',demo:true,first:'Ari',last:'Levin',household:'Levin Family',phone:'604-555-0101',email:'ari@example.invalid',historical:1800,ask:2500,notes:'Fictional demo record. Calling and messaging disabled.'},{id:'demo-maya',demo:true,first:'Maya',last:'Cohen',household:'Cohen Family',phone:'778-555-0122',email:'maya@example.invalid',historical:720,ask:1000,notes:'Fictional demo record. Calling and messaging disabled.'}))}
function queue(){let now=new Date();return db.donors.filter(eligible).sort((a,b)=>{let fa=db.followups.find(f=>f.donorId===a.id&&!f.done),fb=db.followups.find(f=>f.donorId===b.id&&!f.done);return (fa?.due||'9999').localeCompare(fb?.due||'9999')})}
function callScreen(){let q=queue();if(!q.length)return `<div class="card"><h1>No eligible calls in today’s queue</h1><p>Future callbacks stay out of today’s queue. Do-not-contact and retry-limit records are also excluded.</p></div>`;callIndex=Math.min(callIndex,q.length-1);let d=q[callIndex],p=phone(d.phone),alts=phone(d.altPhone),hist=db.activities.filter(a=>a.donorId===d.id).slice(-4).reverse();return `<div class="card"><div class="small">Call ${callIndex+1} of ${q.length}</div><h1>${esc((d.first+' '+d.last).trim()||d.household)}</h1><p>${esc(d.household||'')} ${d.household?'<span class="pill">Calling household</span>':''}</p><div class="grid two"><div><b>Primary</b><div>${esc(d.phone||'Missing')}</div></div><div><b>Alternate</b><div>${esc(d.altPhone||'None')}</div></div></div><div class="row section"><a class="btn call ${!p?'disabled':''}" href="${p?'tel:'+p:'#'}">Call</a><button class="primary ${!p||d.phoneType!=='mobile'?'disabled':''}" onclick="draftText('${d.id}')">Text draft</button><button class="secondary" onclick="callIndex++;render()">Next</button></div>${!p?'<p class="warn">The phone number is missing or invalid, so calling is disabled.</p>':''}${p&&d.phoneType!=='mobile'?'<p class="warn">Text is disabled because this number is not marked mobile. Change the phone type only if you know it supports SMS.</p>':''}<div class="grid two section"><div><b>Historical giving</b><div>${money(d.historical)}</div></div><label>Suggested ask<input id="callAsk" type="number" value="${num(d.ask)}" onchange="updateAsk('${d.id}',this.value)"></label></div><p><b>Notes</b><br>${esc(d.notes||'No notes')}</p><h3>Save outcome</h3><div class="grid two"><label>Outcome<select id="outcome">${['No answer','Left voicemail','Call back','Interested, follow up','Pledged','Declined for this campaign','Wrong number','Do not contact','Skip for now'].map(x=>`<option>${x}</option>`).join('')}</select></label><label>Date/time<input id="nextDate" type="datetime-local"></label></div><label>Outcome notes<textarea id="outcomeNotes"></textarea></label><label>Pledge amount, only when pledged<input id="pledgeAmount" type="number" min="0"></label><button class="primary section" onclick="saveOutcome('${d.id}')">Save outcome</button><p class="small">Opening the dialer or a text draft never marks a call completed or a message sent.</p><h3>Recent contact</h3>${hist.length?hist.map(a=>`<div class="item"><b>${esc(a.outcome)}</b><div class="small">${new Date(a.date).toLocaleString()} · ${esc(a.notes)}</div></div>`).join(''):'<p class="small">No contact history.</p>'}</div>`}
function updateAsk(id,v){let d=db.donors.find(x=>x.id===id);d.ask=num(v);d.updatedAt=new Date().toISOString();save()}
function draftText(id){let d=db.donors.find(x=>x.id===id),p=phone(d.phone);if(!p||d.demo||d.phoneType!=='mobile')return;let text=template(db.settings.templates.first,d);location.href='sms:'+p+'?body='+encodeURIComponent(text)}
function template(t,d,amount=''){let map={name:d.first||d.household||'friend',myName:db.settings.owner,organization:db.settings.organization,campaign:db.settings.campaign,amount:amount?money(amount):'',link:db.settings.donationLink};return t.replace(/\{(\w+)\}/g,(m,k)=>map[k]??m)}
function saveOutcome(id){let outcome=val('outcome'),notes=clean(val('outcomeNotes')),next=val('nextDate'),amount=num(val('pledgeAmount'));mutate(()=>{db.activities.push({id:uid(),donorId:id,outcome,notes,date:new Date().toISOString(),nextAction:next||''});let d=db.donors.find(x=>x.id===id);if(outcome==='Do not contact')d.doNotContact=true;if(['Call back','Interested, follow up'].includes(outcome)){if(!next)return alert('Choose a follow-up date and time.');db.followups.push({id:uid(),donorId:id,due:new Date(next).toISOString(),type:outcome,notes,done:false})}if(outcome==='Pledged'){if(amount<=0)return alert('Enter the pledge amount.');db.pledges.push({id:uid(),donorId:id,amount,date:new Date().toISOString(),void:false})}});callIndex=0}
function followups(){let rows=db.followups.slice().sort((a,b)=>a.due.localeCompare(b.due));return `<h1>Follow-ups</h1>${rows.length?rows.map(f=>{let d=db.donors.find(x=>x.id===f.donorId)||{};return `<div class="item"><div class="row between"><div><b>${esc((d.first+' '+d.last).trim()||'Unknown donor')}</b><div>${esc(f.type)} · ${new Date(f.due).toLocaleString()}</div><div class="small">${esc(f.notes)}</div></div><button class="${f.done?'secondary':'primary'}" onclick="toggleFollow('${f.id}')">${f.done?'Reopen':'Complete'}</button></div></div>`}).join(''):'<div class="card">No follow-ups scheduled.</div>'}`}
function toggleFollow(id){mutate(()=>{let f=db.followups.find(x=>x.id===id);f.done=!f.done})}
function importScreen(){return `<h1>Import and restore</h1><div class="grid two"><div class="card"><h2>Import Excel-exported CSV</h2><p>In Excel: save a copy as <b>CSV UTF-8 (Comma delimited)</b>. Phone numbers and IDs are kept as text by Call Desk.</p><button class="primary" onclick="pick('csv')">Choose CSV</button><p class="small">The next step previews columns and lets you map them. Spreadsheet errors such as #N/A are treated as missing.</p></div><div class="card"><h2>Restore full private-data backup</h2><p>Restore validates and previews the backup before replacing current data.</p><button class="secondary" onclick="pick('json')">Choose JSON backup</button></div></div><div id="importArea" class="section"></div>`}
let pendingFileType='';function pick(t){pendingFileType=t;let f=document.querySelector('#file');f.accept=t==='csv'?'.csv,text/csv':'.json,application/json';f.value='';f.click()}
document.querySelector('#file').addEventListener('change',async e=>{let f=e.target.files[0];if(!f)return;let text=await f.text();pendingFileType==='csv'?previewCSV(text):previewRestore(text)});
function parseCSV(text){let rows=[],row=[],cell='',q=false;for(let i=0;i<text.length;i++){let c=text[i];if(q){if(c==='"'&&text[i+1]==='"'){cell+='"';i++}else if(c==='"')q=false;else cell+=c}else if(c==='"')q=true;else if(c===','){row.push(cell);cell=''}else if(c==='\n'){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=c}if(cell||row.length){row.push(cell);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()))}
let csvRows=[];function previewCSV(text){csvRows=parseCSV(text);if(csvRows.length<2)return alert('No data rows found.');let h=csvRows[0].map(clean),fields=[['','Do not import'],['first','First name'],['last','Last name'],['household','Household'],['phone','Primary phone'],['altPhone','Alternate phone'],['phoneType','Phone type'],['email','Email'],['address','Address'],['historical','Historical giving'],['ask','Suggested ask'],['notes','Notes'],['sourceId','Source/CRM ID']];let maps=h.map((x,i)=>`<label>${esc(x||'Column '+(i+1))}<select id="map${i}">${fields.map(f=>`<option value="${f[0]}">${f[1]}</option>`).join('')}</select></label>`).join('');let preview=csvRows.slice(1,6).map((r,idx)=>`<tr><td>${idx+2}</td>${r.map(x=>`<td>${esc(clean(x))}</td>`).join('')}</tr>`).join('');document.querySelector('#importArea').innerHTML=`<div class="card"><h2>Map columns</h2><div class="grid three">${maps}</div><h3>Preview</h3><div class="scroll"><table><tr><th>Source row</th>${h.map(x=>`<th>${esc(x)}</th>`).join('')}</tr>${preview}</table></div><button class="primary section" onclick="commitCSV()">Import mapped records</button></div>`}
function commitCSV(){let h=csvRows[0],map=h.map((_,i)=>val('map'+i)),sum={imported:0,updated:0,skipped:0,flagged:0};for(let ri=1;ri<csvRows.length;ri++){let r=csvRows[ri],o={};map.forEach((k,i)=>{if(k)o[k]=clean(r[i])});if(!Object.values(o).some(Boolean)){sum.skipped++;continue}o.historical=num(o.historical);o.ask=num(o.ask);o.phone=o.phone||'';o.sourceRow=String(ri+1);let existing=o.sourceId&&db.donors.find(d=>d.sourceId&&d.sourceId===o.sourceId);if(!existing&&o.email)existing=db.donors.find(d=>d.email&&d.email.toLowerCase()===o.email.toLowerCase());if(!existing&&o.phone)existing=db.donors.find(d=>phone(d.phone)&&phone(d.phone)===phone(o.phone));if(existing){let oldNotes=existing.notes||'';Object.keys(o).forEach(k=>{if(k!=='notes'&&o[k]!==''&&o[k]!=null)existing[k]=o[k]});if(o.notes&&!oldNotes.includes(o.notes))existing.notes=[oldNotes,o.notes].filter(Boolean).join('\n--- Imported update ---\n');existing.updatedAt=new Date().toISOString();sum.updated++}else{o.id=uid();o.createdAt=o.updatedAt=new Date().toISOString();let surname=o.last?.toLowerCase(),amb=db.donors.some(d=>(surname&&d.last?.toLowerCase()===surname)||(o.address&&d.address===o.address)||(phone(o.phone)&&phone(d.phone)===phone(o.phone)));o.review=amb;if(amb)sum.flagged++;db.donors.push(o);sum.imported++}}save();render();alert(`Import complete\nImported: ${sum.imported}\nUpdated: ${sum.updated}\nSkipped: ${sum.skipped}\nFlagged for review: ${sum.flagged}`)}
function previewRestore(text){let d;try{d=JSON.parse(text)}catch{return alert('This is not valid JSON.')}if(!d||d.schema!==1||!Array.isArray(d.donors)||!d.settings)return alert('This is not a valid Call Desk backup.');document.querySelector('#importArea').innerHTML=`<div class="card"><h2>Backup preview</h2><p>Organization: <b>${esc(d.settings.organization)}</b><br>Campaign: <b>${esc(d.settings.campaign)}</b><br>Donors: <b>${d.donors.length}</b><br>Activities: <b>${d.activities?.length||0}</b></p><p class="warn">Restoring replaces all current Call Desk data in this browser. Download a backup first if needed.</p><button class="danger" id="restoreBtn">Replace current data</button></div>`;document.querySelector('#restoreBtn').onclick=()=>{if(confirm('Replace all current data with this backup?')){db=d;save();view='dashboard';render()}}}
function settings(){let s=db.settings;return `<h1>Settings and data</h1><div class="card"><div class="grid two">${field('Organization','s_org',s.organization)}${field('Your name','s_owner',s.owner)}${field('Campaign','s_campaign',s.campaign)}${field('Goal','s_goal',s.goal,'number')}${field('Currency','s_currency',s.currency)}${field('Country','s_country',s.country)}${field('Time zone','s_timezone',s.timezone)}${field('Default phone country code','s_cc',s.countryCode)}${field('Donation website','s_link',s.donationLink,'url')}${field('Retry interval in days','s_retry',s.retryDays,'number')}${field('Maximum attempts','s_max',s.maxAttempts,'number')}</div><button class="primary section" onclick="saveSettings()">Save settings</button></div><div class="card section"><h2>Downloads</h2><div class="row"><button class="primary" onclick="backup()">Download private-data backup</button><button class="secondary" onclick="exportCSV()">Export donors/results CSV</button><button class="secondary" onclick="downloadApp()">Download app HTML</button></div><p class="small">App HTML contains the program only, never your donor data. The private-data backup is separate.</p></div><div class="card section"><h2>Important privacy and device note</h2><p>Browser storage does not automatically synchronize between devices and is not a backup. Safari tabs, private browsing, different browsers, and a Home Screen installation may use different storage. To move data, download a private-data JSON backup on the first device and restore it in the exact version of Call Desk you will use on the second device.</p></div>`}
function saveSettings(){Object.assign(db.settings,{organization:val('f_s_org'),owner:val('f_s_owner'),campaign:val('f_s_campaign'),goal:num(val('f_s_goal')),currency:val('f_s_currency'),country:val('f_s_country'),timezone:val('f_s_timezone'),countryCode:val('f_s_cc'),donationLink:val('f_s_link'),retryDays:num(val('f_s_retry')),maxAttempts:num(val('f_s_max'))});save();render()}
function download(name,text,type){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}
function backup(){db.lastBackup=new Date().toISOString();save();download('call-desk-private-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(db,null,2),'application/json')}
function exportCSV(){let cols=['sourceId','sourceRow','first','last','household','phone','altPhone','phoneType','email','address','historical','ask','notes','pledged','paid'];let rows=[cols];db.donors.filter(d=>!d.demo).forEach(d=>{let pl=db.pledges.filter(x=>x.donorId===d.id&&!x.void).reduce((s,x)=>s+num(x.amount),0),pa=db.payments.filter(x=>x.donorId===d.id&&!x.void).reduce((s,x)=>s+num(x.amount),0);rows.push(cols.map(k=>k==='pledged'?pl:k==='paid'?pa:d[k]??''))});download('call-desk-export.csv',rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}
function downloadApp(){fetch('index.html').then(r=>r.text()).then(t=>download('call-desk.html',t,'text/html')).catch(()=>alert('Use the provided index.html file. Browsers may block downloading the app when opened directly from a local file.'))}
function modal(x){document.body.insertAdjacentHTML('beforeend',`<div id="modal" class="modal"><div class="card">${x}</div></div>`)}function closeModal(){document.querySelector('#modal')?.remove()}function val(id){return document.getElementById(id)?.value??''}function go(v){view=v;render()}
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('service-worker.js').catch(()=>{});
</script></body></html>
